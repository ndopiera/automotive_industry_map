name: Unternehmenskarte exportieren

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: GeoJSON exportieren
        run: python export_geojson.py

      - name: Export kontrollieren
        run: |
          ls -la public
          test -s public/unternehmen.geojson

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Veröffentlichungspaket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
