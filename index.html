<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unternehmenskarte Automobilbranche NRW</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#182536;background:#f5f7fa}header{background:#142b45;color:white;padding:16px 22px}h1{font-size:21px;margin:0}header p{margin:5px 0 0;color:#cbd8e6}main{display:grid;grid-template-columns:320px 1fr;height:calc(100dvh - 82px);min-height:440px}aside{overflow:auto;padding:18px;background:white;border-right:1px solid #dce3ea}#map{height:100%;min-height:350px}label,summary{font-weight:650}input[type=search],select,button{width:100%;padding:9px;border:1px solid #bdc9d5;border-radius:6px;background:white;font:inherit;margin:6px 0 12px}button{cursor:pointer;color:#164c82}details{border-top:1px solid #e3e8ef;padding:11px 0}summary{cursor:pointer}.option{display:flex;align-items:flex-start;gap:7px;font-weight:400;margin:8px 0}.option input{margin-top:3px}small{color:#627285}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;margin-top:4px}.count{padding:10px;background:#edf4fa;border-radius:6px;margin-bottom:12px;font-weight:650}#results button{text-align:left;margin:3px 0}#results small{display:block}#status{color:#a33;white-space:pre-wrap}.popup h3{margin:0 0 8px}.popup p{margin:7px 0}.popup{max-width:280px}@media(max-width:700px){main{display:flex;flex-direction:column;height:auto}aside{max-height:45dvh;border-right:0}#map{height:55dvh}header{padding:12px}h1{font-size:17px}}
</style></head><body><header><h1>Unternehmenskarte Automobilbranche NRW</h1><p>Standorte, Lieferketten und Technologiebereiche</p></header><main><aside><div id="count" class="count">Daten werden geladen …</div><div id="status" role="alert"></div><label for="search">Unternehmen oder Stadt suchen</label><input id="search" type="search" placeholder="z. B. HELLA oder Köln"><button id="reset">Filter zurücksetzen</button><details open><summary>Hauptkategorien</summary><div id="cats"></div></details><details open id="subsection"><summary>Unterkategorien</summary><div id="subs"></div></details><details><summary>Lieferkettenrollen</summary><div id="roles"></div></details><label for="size">Unternehmensgröße</label><select id="size"><option value="">Alle</option></select><label for="city">Stadt</label><select id="city"><option value="">Alle</option></select><details><summary>Farblegende</summary><div id="legend"></div><small>Markerfarbe: Hauptkategorie mit kleinster ID.</small></details><details open><summary>Gefundene Standorte</summary><div id="results"></div></details><button id="fit">Ergebnisse auf Karte anzeigen</button></aside><div id="map" aria-label="Unternehmensstandorte"></div></main><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script>
const groups=[['Fahrzeugherstellung',[]],['Antriebs- und Energiesysteme',['Verbrennungsmotoren','Elektromotoren','Getriebe','Hybridsysteme','Brennstoffzellensysteme','Batteriezellen','Batteriemodule','Batteriesysteme (Batteriepacks)','Batteriemanagementsysteme']],['Fahrwerk, Karosserie und Innenraum',['Radaufhängung','Federn','Stoßdämpfer','Lenksysteme','Bremssysteme','Räder und Reifen','Karosseriestrukturen','Leichtbauwerkstoffe','Faserverbundbauteile','Crashstrukturen','Sitzsysteme','Rückhaltesysteme','Innenraumkomponenten','Mensch-Maschine-Schnittstellen']],['Elektronik, Software und Fahrzeugvernetzung',['Sensoren','Elektronische Steuergeräte','Kabelbäume','Leistungselektronik','Beleuchtungssysteme','Eingebettete Software','Fahrerassistenzsysteme','Autonomes Fahren','Fahrzeugvernetzung','Cybersicherheit im Automobilbereich']],['Maschinen-, Anlagenbau und Automatisierung',['Industrierobotik','Werkzeugmaschinen','Produktionslinien','SPS- und Steuerungssysteme','Montagesysteme']],['Mechanische Komponenten, Werkstoffe und Fertigung',['Lager und Wälzlager','Verbindungselemente','Dichtungen','Metallbauteile','Kunststoffe und Polymere']],['Entwicklung, Prüfung und Validierung',['Fahrzeugarchitektur','Fahrzeugintegration','Prototypenbau','Prüfstände','Simulation','Komponentenprüfung','Fahrzeugprüfung','Zertifizierung']],['Motorsport und Performance-Entwicklung',[]],['Forschung und Innovation',[]]];
const colors=['#2563eb','#16a34a','#ea580c','#9333ea','#64748b','#a16207','#0891b2','#dc2626','#db2777'];const roleNames=['OEM','Tier-1-Zulieferer (Direktzulieferer)','Tier-2-Zulieferer','Tier-3-Zulieferer','Indirekter Zulieferer','Nicht zutreffend','Unbekannt'];let next=1;const subGroups=groups.map(g=>g[1].map(n=>({id:next++,name:n})));const $=id=>document.getElementById(id);const selected={cats:new Set(),subs:new Set(),roles:new Set()};let features=[],visible=[];const map=L.map('map').setView([51.48,7.9],8);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const layer=L.layerGroup().addTo(map);
const ids=v=>String(v??'').split(',').map(Number).filter(n=>Number.isInteger(n)&&n>0);const intersects=(a,b)=>!b.size||a.some(x=>b.has(x));const make=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};function checkbox(parent,key,id,name,color){const l=make('label','');l.className='option';const i=document.createElement('input');i.type='checkbox';i.checked=selected[key].has(id);i.onchange=()=>{if(i.checked)selected[key].add(id);else selected[key].delete(id);if(key==='cats')renderSubs();render()};l.append(i);if(color){const d=make('span','');d.className='dot';d.style.background=color;l.append(d)}l.append(make('span',name));parent.append(l)}
function renderSubs(){const allowed=new Set([...selected.cats].flatMap(id=>(subGroups[id-1]||[]).map(s=>s.id)));for(const id of selected.subs)if(!allowed.has(id))selected.subs.delete(id);$('subs').replaceChildren();if(!allowed.size){$('subs').append(make('small',selected.cats.size?'Keine Unterkategorien definiert.':'Zuerst Hauptkategorien auswählen.'));return}for(const id of [...selected.cats].sort((a,b)=>a-b)){const list=subGroups[id-1]||[];if(!list.length)continue;$('subs').append(make('strong',groups[id-1][0]));for(const s of list)checkbox($('subs'),'subs',s.id,s.name)}}
function controls(){ $('cats').replaceChildren();$('roles').replaceChildren();groups.forEach((g,i)=>checkbox($('cats'),'cats',i+1,g[0],colors[i]));roleNames.forEach((r,i)=>checkbox($('roles'),'roles',i+1,r));renderSubs()}
function popup(p){const d=make('div','');d.className='popup';d.append(make('h3',p.name||'Unternehmen'));for(const [label,value] of [['Standort',p.address||[p.address_line_1,p.postal_code,p.city].filter(Boolean).join(' ')],['Unternehmensgröße',p.size],['Lieferkettenrollen',p.roles],['Hauptkategorien',p.categories],['Unterkategorien',p.subcategories],['Beschreibung',p.description]]){if(!value)continue;const line=make('p','');line.append(make('strong',label+': '),document.createTextNode(value));d.append(line)}try{const u=new URL(p.website);if(['https:','http:'].includes(u.protocol)){const a=make('a','Unternehmenswebsite besuchen');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';d.append(a)}}catch{}return d}
function render(){const q=$('search').value.trim().toLocaleLowerCase('de');visible=features.filter(f=>{const p=f.properties;return intersects(ids(p.category_ids),selected.cats)&&intersects(ids(p.subcategory_ids),selected.subs)&&intersects(ids(p.role_ids),selected.roles)&&(!$('size').value||p.size===$('size').value)&&(!$('city').value||p.city===$('city').value)&&[p.name,p.city,p.address].join(' ').toLocaleLowerCase('de').includes(q)});layer.clearLayers();$('results').replaceChildren();for(const f of visible){const p=f.properties;const [lon,lat]=f.geometry.coordinates;const color=colors[(Number(p.primary_category_id)||Math.min(...ids(p.category_ids)))-1]||'#9ca3af';const marker=L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:2,fillColor:color,fillOpacity:.95}).bindPopup(popup(p)).addTo(layer);const b=make('button',p.name||'Unternehmen');b.append(make('small',p.city||''));b.onclick=()=>{map.setView([lat,lon],Math.max(13,map.getZoom()));marker.openPopup()};$('results').append(b)}$('count').textContent=`${new Set(visible.map(f=>f.properties.company_id)).size} Unternehmen · ${visible.length} Standorte / ${features.length}`;if(!visible.length)$('results').append(make('small','Keine passenden Standorte.'))}
function fit(){if(visible.length)map.fitBounds(L.latLngBounds(visible.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]])),{padding:[35,35],maxZoom:13})}function fillSelect(id,key){for(const v of [...new Set(features.map(f=>f.properties[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'))){const o=make('option',v);o.value=v;$(id).append(o)}}controls();groups.forEach((g,i)=>{const p=make('p','');const d=make('span','');d.className='dot';d.style.background=colors[i];p.append(d,document.createTextNode(' '+g[0]));$('legend').append(p)});$('search').oninput=render;$('size').onchange=render;$('city').onchange=render;$('fit').onclick=fit;$('reset').onclick=()=>{Object.values(selected).forEach(s=>s.clear());$('search').value=$('size').value=$('city').value='';controls();render();fit()};
fetch('./unternehmen.geojson',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('Ungültiges GeoJSON');features=data.features.filter(f=>f.properties&&f.geometry?.type==='Point'&&f.geometry.coordinates?.length>=2&&f.geometry.coordinates.slice(0,2).every(Number.isFinite));if(features.some(f=>!('category_ids' in f.properties)||!('subcategory_ids' in f.properties)||!('role_ids' in f.properties)))$('status').textContent='Bitte den erweiterten GeoJSON-Export mit Klassifikations-IDs verwenden; Kategorienfilter funktionieren sonst nicht vollständig.';fillSelect('size','size');fillSelect('city','city');render();fit()}).catch(e=>{$('status').textContent='GeoJSON konnte nicht geladen werden: '+e.message;$('count').textContent='Keine Daten geladen';});
</script></body></html>
